<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <linearGradient id="pinWine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C182F"/>
      <stop offset="100%" stop-color="#550A18"/>
    </linearGradient>
    <linearGradient id="pinGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#936814"/>
    </linearGradient>
    <filter id="pinShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#400" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#pinShadow)">
    <!-- Pin body -->
    <path d="M 40 8 C 22 8 8 22 8 40 C 8 62 40 92 40 92 C 40 92 72 62 72 40 C 72 22 58 8 40 8 Z" 
          fill="url(#pinWine)" stroke="url(#pinGold)" stroke-width="2.5"/>
    <!-- Golden inner ring -->
    <circle cx="40" cy="38" r="16" fill="#FFFBF5" stroke="url(#pinGold)" stroke-width="1.8"/>
    <!-- Center heart symbol -->
    <path d="M 40 45 C 40 45 32 39 32 35 C 32 32 34 30 37 30 C 38.5 30 39.5 31 40 32 C 40.5 31 41.5 30 43 30 C 46 30 48 32 48 35 C 48 39 40 45 40 45 Z" 
          fill="url(#pinWine)"/>
    <!-- Ground shadow ellipse -->
    <ellipse cx="40" cy="94" rx="14" ry="3.5" fill="#550A18" opacity="0.35"/>
  </g>
</svg>