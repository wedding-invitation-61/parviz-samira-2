<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="islGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6CC"/>
      <stop offset="40%" stop-color="#DFB143"/>
      <stop offset="80%" stop-color="#B6831B"/>
      <stop offset="100%" stop-color="#F2D179"/>
    </linearGradient>
    <linearGradient id="islWine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B34"/>
      <stop offset="100%" stop-color="#550917"/>
    </linearGradient>
  </defs>
  <g>
    <!-- Corner sweeping vine -->
    <path d="M 0 0 L 80 0 C 80 40 40 80 0 80 Z" fill="url(#islWine)" opacity="0.18"/>
    <path d="M 0 10 Q 70 10 70 80" fill="none" stroke="url(#islGold)" stroke-width="2"/>
    <path d="M 10 0 Q 10 70 80 70" fill="none" stroke="url(#islGold)" stroke-width="1.5" stroke-dasharray="3 3"/>
    
    <!-- Main spiral islimi scroll -->
    <path d="M 0 0 C 60 10 110 50 120 110 C 125 140 100 160 80 150 C 60 140 70 110 90 110 C 105 110 110 125 105 135" 
          fill="none" stroke="url(#islGold)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Bodom / Paisley leaf emerging from corner -->
    <path d="M 35 35 C 65 15 85 45 65 70 C 50 85 30 75 35 35 Z" 
          fill="url(#islWine)" stroke="url(#islGold)" stroke-width="1.5"/>
    <circle cx="52" cy="50" r="3.5" fill="url(#islGold)"/>

    <!-- Pomegranate bud on vine branch -->
    <g transform="translate(130, 90) rotate(45)">
      <ellipse cx="0" cy="0" rx="14" ry="12" fill="url(#islWine)" stroke="url(#islGold)" stroke-width="1.5"/>
      <path d="M -4 -12 L 0 -17 L 4 -12 Z" fill="url(#islGold)"/>
      <circle cx="0" cy="0" r="3" fill="url(#islGold)"/>
    </g>

    <!-- Small flourish leaves -->
    <path d="M 90 45 C 105 40 115 50 105 60 C 95 70 85 60 90 45 Z" fill="url(#islGold)"/>
    <path d="M 45 90 C 40 105 50 115 60 105 C 70 95 60 85 45 90 Z" fill="url(#islGold)"/>
  </g>
</svg>