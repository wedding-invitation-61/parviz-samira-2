<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <linearGradient id="waveGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C59325"/>
      <stop offset="25%" stop-color="#FFEFA8"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="75%" stop-color="#FFEAA0"/>
      <stop offset="100%" stop-color="#A57316"/>
    </linearGradient>
    <linearGradient id="waveGoldThin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A57316"/>
      <stop offset="35%" stop-color="#FFEFA8"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#91600E"/>
    </linearGradient>
    <filter id="waveShadow" x="-10%" y="-30%" width="120%" height="200%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#553508" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#waveShadow)">
    <!-- Primary wave line -->
    <path d="M 0 55 C 300 115 700 -5 1000 55" fill="none" stroke="url(#waveGold)" stroke-width="5" stroke-linecap="round"/>
    <!-- Secondary delicate echo wave line -->
    <path d="M 0 66 C 300 126 700 6 1000 66" fill="none" stroke="url(#waveGoldThin)" stroke-width="1.8" opacity="0.85"/>
  </g>
</svg>